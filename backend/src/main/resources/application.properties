spring.application.name=backend

# 비밀 키(구글 OAuth, LLM API 키)는 application-secret.properties에 따로 두고 커밋하지 않는다
spring.config.import=optional:classpath:application-secret.properties

# 기본: H2 메모리 DB (설치 없이 바로 실행, 재시작하면 데이터 초기화)
spring.datasource.url=jdbc:h2:mem:blooming;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 응답에 charset=UTF-8을 붙여서 PowerShell 등에서도 한글이 안 깨지게
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Gemini (키는 application-secret.properties의 gemini.api-key에)
gemini.model=gemini-3.5-flash-lite
# 사용자 1명이 하루에 부를 수 있는 AI 횟수
gemini.daily-limit=20

# 로그인
# 구글 로그인 후 돌아갈 프론트 주소
app.frontend-url=http://localhost:5173
# 로그인 토큰 유효 시간
app.jwt.expire-hours=24
# 개발 모드: 토큰 없이도 X-User-Id 헤더(없으면 1번)로 로그인 처리. 발표/배포 때 false로
app.auth.dev-mode=true
