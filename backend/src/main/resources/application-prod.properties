# 배포 서버 설정. SPRING_PROFILES_ACTIVE=prod 일 때만 적용된다.
# 값은 전부 배포 서비스의 "환경 변수"로 넣는다 (여기에 키를 적지 않는다).

# ===== DB (MySQL) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ===== 로그인 =====
# 토큰 없이 1번 유저로 들어가는 개발 모드 끄기
app.auth.dev-mode=false
# 배포한 프론트 주소 (예: https://blooming.vercel.app)
app.frontend-url=${FRONTEND_URL}
app.jwt.secret=${JWT_SECRET}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===== AI =====
gemini.api-key=${GEMINI_API_KEY}

# 배포 서비스가 앞단에서 https를 처리해도, 구글 로그인 주소가 https로 만들어지게
server.forward-headers-strategy=framework
